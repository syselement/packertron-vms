#cloud-config
#
# Autoinstall seed for an unattended Ubuntu Desktop install that enables the
# packertron-firstboot service, so 02 and 03 run on first boot.
# Do not alter the first line.
#
# Docs:
#   Autoinstall  https://canonical-subiquity.readthedocs-hosted.com/en/latest/reference/autoinstall-reference.html
#   cloud-init   https://cloudinit.readthedocs.io/en/latest/
#   README.md    which seed to use, and the first-boot runner
#
# Run:
#   sudo cloud-init schema --config-file autoinstall-desktop.yaml --annotate
#
# Keep this to ONE document: cloud-init reads the first and silently ignores
# anything appended after it.

autoinstall:
  # version is an Autoinstall required field.
  version: 1
  # shutdown: poweroff

  # Configure locale, keyboard and timezone
  locale: en_GB
  keyboard:
    layout: it
  timezone: Europe/Rome

  # Set the installation source
  # IMPORTANT: verify this value from the ISO at: casper/install-sources.yaml
  source:
    id: ubuntu-desktop

  # Configure the storage layout
  storage:
    layout:
      name: lvm
      sizing-policy: all

  # Configure the initial user for the system and hostname
  # Password needs to be generated with
  #   openssl passwd -6 -stdin <<< 'packer'
  # or
  #   mkpasswd -m sha-512 packer
  identity:
    hostname: systhinx
    username: syselement
    password: "$6$OxXY0.ndy/Q1c4mU$A6QNNCNXD24WVyJXm5gpHd5tq7tjLhJKAf1wAoG0yjsFdO0vFCs02JBtKRUqT0ivHXDdzFtKhs66jvL/x0rKM1" # password: packer

  # Configure OpenSSH server - install (Internet access is required) and
  # configure authorized keys
  ssh:
    install-server: true
    authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPA3hxPOnJAjCFoZMz8mcT+fZTy5j0vjLWPGVM2vaA88
    allow-pw: false

  # Packages to install (via apt-get install)
  packages:
    - ca-certificates
    - git

  # Cloud-init configuration applied after installation during the first boot.
  user-data:
    write_files:
      # This machine's settings. Everything below the marker is generated from
      # scripts/ubuntu/firstboot/ - edit those files and run
      # scripts/sync-firstboot.sh rather than editing the copy here.
      - path: /etc/packertron/firstboot.conf
        owner: root:root
        permissions: '0644'
        content: |
          # Must match the account the identity block above creates: there is
          # no SUDO_USER under systemd, and discovery fails once a second
          # account exists.
          TARGET_USER=syselement
          STEPS=02,03

      # >>> packertron-firstboot: generated by scripts/sync-firstboot.sh >>>
      - path: /usr/local/sbin/packertron-firstboot
        owner: root:root
        permissions: '0750'
        content: |
          #!/usr/bin/env bash
          #
          # Fetch the provisioning repository and hand off to the runner it carries.
          # cloud-init writes this file to /usr/local/sbin/packertron-firstboot; it is
          # the only part of the first-boot path that has to be embedded in a seed, so
          # it is kept small and everything else lives in run.sh beside it.
          #
          # Settings come from /etc/packertron/firstboot.conf, which is read as
          # KEY=VALUE and never sourced: the file is written by whoever deploys the
          # machine, and sourcing it would make it arbitrary root code.
          #
          # Docs:
          #   cloud-init  https://cloudinit.readthedocs.io/en/latest/
          #   README.md   ../README.md, the first-boot runner and its settings
          #
          # Run:
          #   The packertron-firstboot.service unit invokes this; not run by hand.
          #   Lint it with: ../../check-templates.sh shell

          set -Eeuo pipefail

          CONF_FILE=/etc/packertron/firstboot.conf
          LOG_FILE=/var/log/packertron-firstboot.log
          RUNNER_PATH=scripts/ubuntu/firstboot/run.sh

          # Last assignment wins, quotes are optional, and anything else in the file is
          # ignored. Never source: this must not be able to execute code as root.
          conf_value() {
              local key="$1" value=""

              [[ -r "$CONF_FILE" ]] || return 0
              value="$(sed -n "s/^[[:space:]]*${key}[[:space:]]*=[[:space:]]*//p" "$CONF_FILE" | tail -n 1)"
              value="${value%\"}" && value="${value#\"}"
              value="${value%\'}" && value="${value#\'}"
              printf '%s' "$value"
          }

          touch "$LOG_FILE"
          chmod 0600 "$LOG_FILE"
          exec > >(tee -a "$LOG_FILE") 2>&1

          PACKERTRON_REPO_URL="$(conf_value REPO_URL)"
          PACKERTRON_REPO_BRANCH="$(conf_value REPO_BRANCH)"
          PACKERTRON_REPO_DIR="$(conf_value REPO_DIR)"
          PACKERTRON_TARGET_USER="$(conf_value TARGET_USER)"
          PACKERTRON_STEPS="$(conf_value STEPS)"
          : "${PACKERTRON_REPO_URL:=https://github.com/syselement/packertron-vms.git}"
          : "${PACKERTRON_REPO_BRANCH:=main}"
          : "${PACKERTRON_REPO_DIR:=/opt/packertron-vms}"
          export PACKERTRON_REPO_URL PACKERTRON_REPO_BRANCH PACKERTRON_REPO_DIR
          export PACKERTRON_TARGET_USER PACKERTRON_STEPS

          # Checked here because this is where they reach git. A URL from the conf file
          # that begins with a dash would otherwise be read as an option.
          [[ "$PACKERTRON_REPO_URL" =~ ^https://[A-Za-z0-9._~:/?#@!$\&\'\(\)*+,\;=%-]+$ ]] ||
              {
                  echo "ERROR: refusing a non-https repository URL: $PACKERTRON_REPO_URL" >&2
                  exit 1
              }
          [[ "$PACKERTRON_REPO_BRANCH" =~ ^[A-Za-z0-9._/-]+$ && "$PACKERTRON_REPO_BRANCH" != -* ]] ||
              {
                  echo "ERROR: invalid repository branch: $PACKERTRON_REPO_BRANCH" >&2
                  exit 1
              }

          command -v git >/dev/null 2>&1 ||
              {
                  echo "ERROR: git is not installed; cannot fetch the provisioning repository" >&2
                  exit 1
              }

          echo "Waiting for GitHub connectivity..."
          reachable=false
          for attempt in $(seq 1 30); do
              if git ls-remote "$PACKERTRON_REPO_URL" HEAD >/dev/null 2>&1; then
                  reachable=true
                  break
              fi
              echo "GitHub unavailable; retry ${attempt}/30"
              sleep 10
          done
          [[ "$reachable" == true ]] || {
              echo "ERROR: GitHub remained unreachable" >&2
              exit 1
          }

          if [[ -d "$PACKERTRON_REPO_DIR/.git" ]]; then
              echo "Updating managed repository checkout"
              git -C "$PACKERTRON_REPO_DIR" fetch --prune origin
          else
              # A leftover non-repository directory would make git clone fail identically
              # on every retry, wedging the bootstrap forever.
              [[ ! -e "$PACKERTRON_REPO_DIR" ]] || rm -rf -- "$PACKERTRON_REPO_DIR"
              echo "Cloning managed repository checkout"
              install -d -m 0755 "$(dirname "$PACKERTRON_REPO_DIR")"
              git clone --branch "$PACKERTRON_REPO_BRANCH" "$PACKERTRON_REPO_URL" "$PACKERTRON_REPO_DIR"
          fi

          # Run from a copy on tmpfs, never from the checkout: the runner moves the
          # checkout between revisions, and Bash re-reads a script file as it executes.
          install -m 0700 "$PACKERTRON_REPO_DIR/$RUNNER_PATH" /run/packertron-firstboot-run
          exec /run/packertron-firstboot-run
      - path: /etc/systemd/system/packertron-firstboot.service
        owner: root:root
        permissions: '0644'
        content: |
          [Unit]
          Description=Packertron retryable first-boot provisioning
          Wants=network-online.target
          After=network-online.target cloud-final.service
          StartLimitIntervalSec=0

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/packertron-firstboot
          ExecStartPost=/usr/bin/systemctl disable packertron-firstboot.service
          ExecStartPost=/usr/bin/rm -f /etc/systemd/system/packertron-firstboot.service
          ExecStartPost=/usr/bin/systemctl daemon-reload
          Restart=on-failure
          RestartSec=5min
          TimeoutStartSec=infinity

          [Install]
          WantedBy=multi-user.target
      # <<< packertron-firstboot <<<

    runcmd:
      - [systemctl, daemon-reload]
      - [systemctl, enable, packertron-firstboot.service]
      - [systemctl, start, --no-block, packertron-firstboot.service]

  # Update the APT package database and upgrade installed packages
  # automatically on first boot
  # package_update: true
  # package_upgrade: true

  # Shell commands to run after the installation has completed successfully and
  # any updates and packages installed, just before the system reboots The
  # commands are run in the installer environment with the installed system
  # mounted at /target
  late-commands:
    - curtin in-target -- truncate -s 0 /etc/machine-id /var/lib/dbus/machine-id
    - echo 'syselement ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/99-syselement
    - chmod 0440 /target/etc/sudoers.d/99-syselement


# Validate this file with `sudo cloud-init schema --config-file user-data
# --annotate` or `sudo cloud-init schema --config-file autoinstall-desktop.yaml --annotate`
