# Release automation: bumps version.yaml, regenerates CHANGELOG.md, tags.
#
# Before touching branch protection:
#
# 1. No pull_request trigger, so this never reports a status on a PR. Never add
#    it to a ruleset's required checks - it would be permanently "expected" and
#    no PR could merge.
# 2. It pushes straight to main. A ruleset requiring a PR before merging blocks
#    that push and breaks releases; give the release actor a bypass entry.

name: Changelog CI

on:
  release:
    types: [created, edited]
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'  # Ignore changes to workflow files

  workflow_dispatch:

# Default to read-only; the one job that needs to write grants itself the token.
permissions:
  contents: read

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job commits the bump and pushes the tag, so it keeps its checkout credentials and must stay the only one with write access.
    permissions:
      contents: write
    steps:
      # - RELEASE_TOKEN, not GITHUB_TOKEN: rulesets enforce required checks on direct pushes too, and the release commit is made on the runner so it has no check runs.
      # - github-actions[bot] is not an admin and cannot bypass; RELEASE_TOKEN is the owner's PAT, which the bypass list allows.
      # - The fallback keeps forks working - they fail at push, not at checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: "✏️ Conventional Changelog Action"
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          skip-git-pull: "true"
          version-file: 'version.yaml'
          version-path: 'version'