# cloudbase-init main configuration for the Proxmox Windows templates: the
# service that runs on every boot of a clone after sysprep.
#
# Based on what CloudbaseInitSetup_1_1_8_x64.msi writes itself
# (ConfFileActions.js in Cloudbase Solutions' cloudbase-init-installer, used
# under the Apache License 2.0). Changed here: the settings the Proxmox
# documentation lists for its configdrive2 cloud-init drive.
#
# Docs:
#   cloudbase-init  https://cloudbase-init.readthedocs.io/en/latest/config.html
#   Proxmox         https://pve.proxmox.com/pve-docs/chapter-qm.html (Cloud-Init on Windows)
#   Upstream        https://github.com/cloudbase/cloudbase-init-installer/blob/master/CloudbaseInitSetup/Actions/ConfFileActions.js
#   Apache-2.0      https://www.apache.org/licenses/LICENSE-2.0
#   WINDOWS.md      ../../../templates/proxmox/WINDOWS.md, the clone-time model
#
# Run: each template renders this with templatefile() into C:\Windows\Temp\,
# and 11_cloudbase_init.ps1 copies it into place.

[DEFAULT]
# The account cloudbase-init manages on the clone. Windows 10 and 11 rename the
# built-in Administrator (RID 500) to syselement, so the clone has one admin
# account named like the Linux clones rather than a second one beside it.
# Server keeps Administrator and does not rename it.
username=${username}
groups=Administrators
rename_admin_user=${rename_admin_user}

# admin_pass from the drive when deploy/ sets TF_VAR_password; otherwise
# SetUserPasswordPlugin generates a random one, so the build password never
# survives into a clone and the account is reachable by key only.
inject_user_password=true
first_logon_behaviour=no

# Proxmox presents configdrive2 to any Windows ostype. Naming only this
# service skips minutes of probing HTTP, EC2 and MaaS endpoints on every boot.
# Where to look for the drive is left at its defaults - raw disk, CD-ROM and
# VFAT all on - rather than the config_drive_* keys the MSI writes, which are
# deprecated for removal.
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService

# The default list minus WindowsLicensingPlugin and both WinRM plugins. Left
# unset, ConfigWinRMListenerPlugin would open an HTTPS WinRM listener on every
# clone; these templates are managed over SSH.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.windows.ntpclient.NTPClientPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.createuser.CreateUserPlugin,cloudbaseinit.plugins.common.networkconfig.NetworkConfigPlugin,cloudbaseinit.plugins.common.sshpublickeys.SetUserSSHPublicKeysPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin,cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin

bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true

# No phone-home to cloudbase.it on every boot of every clone.
check_latest_version=false

verbose=true
debug=true
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=
