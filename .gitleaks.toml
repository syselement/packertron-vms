# gitleaks configuration.
#
# Start from the upstream ruleset and narrow it in exactly one place.

[extend]
useDefault = true

[allowlist]
description = """
The autoinstall seeds commit a SHA-512 crypt hash for the initial user, which
is unavoidable for an unattended install: subiquity needs the hash before
anything exists to fetch a secret from. Treat it as public - see SECURITY.md.

The Windows answer files carry a KMS client setup key. Those are published by
Microsoft and activate nothing on their own.

Only these two patterns are allowlisted, never the files that carry them, so a
real credential added to those same files is still reported.
"""
regexes = [
  # SHA-512 crypt hash, as written by mkpasswd -m sha-512.
  '''\$6\$[./A-Za-z0-9]{1,32}\$[./A-Za-z0-9]{20,}''',
  # - The one KMS client setup key this repository carries, matched literally rather than by shape.
  # - A pattern for "five groups of five" would allowlist every future key without anyone looking at it; this way, adding another edition's key is a finding that has to be read and re-approved.
  '''NPPR9-FWDCX-D2C8J-H872K-2YT43''',
]
