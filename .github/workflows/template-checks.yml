name: Template checks

# Validates the Packer HCL, the cloud-init seeds and the Windows answer files,
# lints the shell outside scripts/ubuntu/ and the PowerShell, and scans the
# tree for committed secrets.

on:
  # - No paths filter on pull_request, deliberately: a path-filtered workflow
  #   never reports a status on a PR that matches nothing, so a ruleset
  #   requiring it would wait forever.
  # - Filtering stays on push, which gates nothing.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.pkr.hcl"
      - "**/*.pkrvars.hcl"
      - "**/http/user-data"
      - "**/http/meta-data"
      - "**/http/*.preseed"
      - "templates/**/*.xml"
      - "scripts/windows/**"
      - "scripts/ubuntu/autoinstall-*.yaml"
      - "scripts/check-templates.sh"
      - "scripts/sync-firstboot.sh"
      - "scripts/proxmox/**"
      - ".githooks/**"
      - "**/*.yml"
      - "**/*.yaml"
      - "scripts/ubuntu/firstboot/**"
      - "deploy/**"
      - "templates/**/*.sh"
      - "**/*.md"
      - ".github/workflows/template-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packer:
    name: "packer: ${{ matrix.template }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each entry is the template's path under templates/. The checker job
        # below fails if this list and the directories on disk disagree.
        template:
          - proxmox/kali
          - proxmox/win-10
          - proxmox/win-11
          - proxmox/win-srv-2025
          - proxmox/ubuntu-24.04-server
          - proxmox/ubuntu-26.04-server
          - proxmox/ubuntu-26.04-desktop
          - vmware/ubuntu-24.04-desktop
          - vmware/ubuntu-26.04-desktop
          - vmware/ubuntu-24.04-server
          - vmware/ubuntu-26.04-server
          - vmware/win-srv-2025

    steps:
      # Actions are pinned to commits rather than tags; Dependabot keeps them current.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "latest"

      # A third-party plugin (rgl/windows-update) is fetched through the GitHub
      # API, which allows 60 unauthenticated requests an hour per runner IP.
      # The job's read-only token lifts that; only this step sees it.
      - name: Install plugins
        working-directory: templates/${{ matrix.template }}
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packer init .

      - name: Check formatting
        working-directory: templates/${{ matrix.template }}
        run: packer fmt -check -diff .

      - name: Validate
        working-directory: templates/${{ matrix.template }}
        # The Proxmox builder will not validate without a username and token.
        # Throwaway values: validate never contacts the API.
        run: |
          if grep -q 'proxmox-iso' ./*.pkr.hcl; then
            packer validate \
              -var 'proxmox_api_token_id=ci@pve!ci' \
              -var 'proxmox_api_token_secret=ci-not-a-real-secret' \
              -var 'ssh_password=ci-not-a-real-secret' \
              .
          else
            packer validate .
          fi

  cloud-init:
    name: cloud-init schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cloud-init
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cloud-init

      - name: Validate every debian-installer preseed
        run: ./scripts/check-templates.sh preseeds

      - name: Validate every seed file
        run: |
          status=0
          # shellcheck disable=SC2044
          for file in scripts/ubuntu/autoinstall-*.yaml templates/*/*/http/user-data; do
            [ -f "$file" ] || continue

            # cloud-init reads the first document and silently ignores the
            # rest, so a second one is dead text that looks live.
            documents=$(grep -c '^#cloud-config' "$file" || true)
            if [ "$documents" -gt 1 ]; then
              printf '%s: %s #cloud-config documents; only the first is read\n' \
                "$file" "$documents" >&2
              status=1
            fi

            printf '== %s\n' "$file"
            sudo cloud-init schema --config-file "$file" --annotate || status=1
          done
          exit "$status"

  opentofu:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Validate the deploy module
        run: ./scripts/check-templates.sh tofu

  checker:
    # Lints the shell that ubuntu-static-checks.yml does not cover, and owns
    # the one invariant CI cannot express itself: the matrix above is
    # hand-written, because GitHub evaluates it before any checkout and so
    # cannot discover directories.
    name: Checker script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # check-templates.sh skips a linter that is missing; here a missing one
      # fails instead, so a change of runner image cannot quietly drop a check.
      CHECKS_REQUIRE_TOOLS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shell, XML and YAML tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck shfmt libxml2-utils bats yamllint

      # Pinned, and actionlint checked against its digest: a linter runs on the
      # same runner as everything else in this job.
      - name: Install actionlint and zizmor
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ZIZMOR_VERSION: "1.30.1"
        run: |
          curl --fail --show-error --silent --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          sudo tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C /usr/local/bin actionlint
          pipx install "zizmor==${ZIZMOR_VERSION}"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Lint shell outside scripts/ubuntu/
        run: ./scripts/check-templates.sh shell

      - name: Verify Markdown keeps each sentence on one line
        run: ./scripts/check-templates.sh docs

      - name: Verify the CI matrix matches the templates on disk
        run: ./scripts/check-templates.sh matrix

      - name: Verify the embedded first-boot copies are current
        run: ./scripts/check-templates.sh firstboot

      - name: Validate the Windows answer files
        run: ./scripts/check-templates.sh unattend

      # The runner image ships pwsh and PSScriptAnalyzer, and check-templates.sh
      # skips rather than fails where either is missing. Asserting them here
      # stops a change of image from quietly turning this check into a skip.
      - name: Require pwsh and PSScriptAnalyzer
        run: |
          # shellcheck disable=SC2016 # the quoted text is PowerShell, its $ are pwsh's
          pwsh -NoProfile -Command '
            $PSVersionTable.PSVersion.ToString()
            $m = Get-Module -ListAvailable -Name PSScriptAnalyzer | Select-Object -First 1
            if (-not $m) { Write-Error "PSScriptAnalyzer is not installed"; exit 1 }
            $m.Version.ToString()
          '

      - name: Parse and lint every PowerShell script
        run: ./scripts/check-templates.sh powershell

      - name: Lint the YAML
        run: ./scripts/check-templates.sh yaml

      # The token lets zizmor run its online audits too: an action pinned to an
      # impostor commit, or to a version with a known vulnerability.
      - name: Lint and audit the workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-templates.sh workflows

      - name: Run the Bats suites outside scripts/ubuntu/
        run: ./scripts/check-templates.sh bats

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans history, so it needs all of it.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  template-checks:
    # Mark THIS job as the required status check, not the jobs above: packer is
    # a matrix and emits one context per template, so requiring those breaks
    # the ruleset whenever a template is added or renamed.
    #
    # if: always() matters - without it this job is skipped when anything it
    # needs fails, and a skipped required check blocks the PR with no failure
    # to look at.
    name: Template checks complete
    if: always()
    needs:
      - packer
      - cloud-init
      - opentofu
      - checker
      - secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify that every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'upstream results: %s\n' "$RESULTS"
          status=0
          for result in $RESULTS; do
            case "$result" in
              # skipped counts as a pass so a future "if:" on a job above does
              # not wedge the gate.
              success | skipped) ;;
              *)
                printf 'a required job reported: %s\n' "$result" >&2
                status=1
                ;;
            esac
          done
          exit "$status"
