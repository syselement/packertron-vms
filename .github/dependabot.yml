# Workflow actions are pinned to commit SHAs for supply-chain safety, which
# means nothing updates them on its own. Dependabot opens the PRs that keep
# those pins current, rewriting both the SHA and the trailing "# vN" comment.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    # No "labels:" key on purpose. Dependabot creates its own default
    # "dependencies" label when it is missing, but any label named here must
    # already exist in the repository, and it refuses the whole config when one
    # does not. Create the labels first if you want custom ones.
