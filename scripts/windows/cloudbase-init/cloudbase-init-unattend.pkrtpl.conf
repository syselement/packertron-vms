# cloudbase-init configuration for the sysprep specialize pass. Unattend.xml
# runs cloudbase-init once with this file, before OOBE, to set the hostname and
# grow the disk; the service then runs cloudbase-init.conf on every boot.
#
# Matches what CloudbaseInitSetup_1_1_8_x64.msi writes for this file, with the
# metadata service narrowed the same way as cloudbase-init.conf.
#
# Docs:
#   cloudbase-init  https://cloudbase-init.readthedocs.io/en/latest/tutorial.html#sysprep
#   WINDOWS.md      ../../../templates/proxmox/WINDOWS.md, the clone-time model
#
# Run: each template renders this with templatefile() into C:\Windows\Temp\,
# and 11_cloudbase_init.ps1 copies it into place.

[DEFAULT]
username=${username}
groups=Administrators
inject_user_password=true
first_logon_behaviour=no

metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService

# Exactly the three plugins the MSI's own unattend file runs. A reboot here
# would interrupt setup, so the hostname takes effect on the next boot instead.
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin
allow_reboot=false
stop_service_on_exit=false

bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
mtu_use_dhcp_config=true
ntp_use_dhcp_config=true
check_latest_version=false

verbose=true
debug=true
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init-unattend.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=
