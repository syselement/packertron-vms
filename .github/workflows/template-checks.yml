name: Template checks

# Validates the Packer HCL and the cloud-init seeds, lints the shell outside
# scripts/ubuntu/, and scans the tree for committed secrets.

on:
  # - No paths filter on pull_request, deliberately: a path-filtered workflow
  #   never reports a status on a PR that matches nothing, so a ruleset
  #   requiring it would wait forever.
  # - Filtering stays on push, which gates nothing.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.pkr.hcl"
      - "**/*.pkrvars.hcl"
      - "**/http/user-data"
      - "**/http/meta-data"
      - "scripts/ubuntu/autoinstall-*.yaml"
      - "scripts/check-templates.sh"
      - "templates/**/*.sh"
      - ".github/workflows/template-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packer:
    name: "packer: ${{ matrix.template }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each entry is the template's path under templates/. The checker job
        # below fails if this list and the directories on disk disagree.
        #
        # proxmox/win-11 is deliberately absent: it depends on a KeePass
        # database that is not in this repository, so it cannot validate.
        template:
          - proxmox/kali
          - proxmox/ubuntu-24.04-server
          - vmware/ubuntu-24.04-desktop
          - vmware/ubuntu-26.04-desktop
          - vmware/ubuntu-24.04-server
          - vmware/ubuntu-26.04-server
          - vmware/win-srv-2025

    steps:
      # Actions are pinned to commits rather than tags; Dependabot keeps them current.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "latest"

      - name: Install plugins
        working-directory: templates/${{ matrix.template }}
        run: packer init .

      - name: Check formatting
        working-directory: templates/${{ matrix.template }}
        run: packer fmt -check -diff .

      - name: Validate
        working-directory: templates/${{ matrix.template }}
        # The Proxmox builder will not validate without a username and token.
        # Throwaway values: validate never contacts the API.
        run: |
          if grep -q 'proxmox-iso' ./*.pkr.hcl; then
            packer validate \
              -var 'proxmox_api_token_id=ci@pve!ci' \
              -var 'proxmox_api_token_secret=ci-not-a-real-secret' \
              -var 'ssh_password=ci-not-a-real-secret' \
              .
          else
            packer validate .
          fi

  cloud-init:
    name: cloud-init schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cloud-init
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cloud-init

      - name: Validate every seed file
        run: |
          status=0
          # shellcheck disable=SC2044
          for file in scripts/ubuntu/autoinstall-*.yaml templates/*/*/http/user-data; do
            [ -f "$file" ] || continue

            # cloud-init reads the first document and silently ignores the
            # rest, so a second one is dead text that looks live.
            documents=$(grep -c '^#cloud-config' "$file" || true)
            if [ "$documents" -gt 1 ]; then
              printf '%s: %s #cloud-config documents; only the first is read\n' \
                "$file" "$documents" >&2
              status=1
            fi

            printf '== %s\n' "$file"
            sudo cloud-init schema --config-file "$file" --annotate || status=1
          done
          exit "$status"

  checker:
    # Lints the shell that ubuntu-static-checks.yml does not cover, and owns
    # the one invariant CI cannot express itself: the matrix above is
    # hand-written, because GitHub evaluates it before any checkout and so
    # cannot discover directories.
    name: Checker script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck shfmt

      - name: Lint shell outside scripts/ubuntu/
        run: ./scripts/check-templates.sh shell

      - name: Verify the CI matrix matches the templates on disk
        run: ./scripts/check-templates.sh matrix

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks scans history, so it needs all of it.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  template-checks:
    # Mark THIS job as the required status check, not the jobs above: packer is
    # a matrix and emits one context per template, so requiring those breaks
    # the ruleset whenever a template is added or renamed.
    #
    # if: always() matters - without it this job is skipped when anything it
    # needs fails, and a skipped required check blocks the PR with no failure
    # to look at.
    name: Template checks complete
    if: always()
    needs:
      - packer
      - cloud-init
      - checker
      - secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify that every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'upstream results: %s\n' "$RESULTS"
          status=0
          for result in $RESULTS; do
            case "$result" in
              # skipped counts as a pass so a future "if:" on a job above does
              # not wedge the gate.
              success | skipped) ;;
              *)
                printf 'a required job reported: %s\n' "$result" >&2
                status=1
                ;;
            esac
          done
          exit "$status"
