# gitleaks configuration.
#
# Start from the upstream ruleset and narrow it in exactly one place.

[extend]
useDefault = true

[allowlist]
description = """
The autoinstall seeds commit a SHA-512 crypt hash for the initial user. That
is deliberate and unavoidable for an unattended install: subiquity needs the
hash at install time, before anything exists to fetch a secret from.

Treat it as public. The plaintext is documented in the seed files, so every
machine built from this repository starts with the same known console
password, and the same seeds grant that user NOPASSWD sudo. These images are
for a lab; do not expose one to an untrusted network without changing the
password first.

The Windows answer files carry a KMS client setup key. Those are published by
Microsoft, one per edition, and exist so that a machine can find a KMS host;
they activate nothing on their own. The file that holds it cites the Microsoft
page it came from.

Only these two patterns are allowlisted, never the files that carry them, so a
real credential added to those same files is still reported.
"""
regexes = [
  # SHA-512 crypt hash, as written by mkpasswd -m sha-512.
  '''\$6\$[./A-Za-z0-9]{1,32}\$[./A-Za-z0-9]{20,}''',
  # The one KMS client setup key this repository carries, matched literally
  # rather than by shape. A pattern for "five groups of five" would allowlist
  # every future key without anyone looking at it; this way, adding another
  # edition's key is a finding that has to be read and re-approved.
  '''NPPR9-FWDCX-D2C8J-H872K-2YT43''',
]
