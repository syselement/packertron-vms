name: Ubuntu static checks

on:
  # No paths filter on pull_request, deliberately: a path-filtered workflow
  # never reports a status on a PR that matches nothing, so a ruleset requiring
  # it would wait forever. Filtering stays on push, which gates nothing.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "scripts/ubuntu/**"
      - "templates/vmware/ubuntu-24.04-desktop/Vagrantfile"
      - "templates/vmware/ubuntu-26.04-desktop/Vagrantfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    # This name is the status check context. Keep it stable: the branch ruleset
    # refers to it by this exact string.
    name: Ubuntu static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: scripts/ubuntu

    steps:
      - name: Check out repository
        # Pinned to a commit, not a tag: a tag can be moved. Dependabot keeps
        # the pin current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bats shellcheck shfmt

      - name: Validate Bash syntax
        run: bash -n ./*.sh ./lib/*.sh

      - name: Run ShellCheck
        run: shellcheck -x ./*.sh ./lib/*.sh

      - name: Check shell formatting
        run: shfmt -d -i 4 -ci ./*.sh ./lib/*.sh

      - name: Run project tests
        run: bats tests

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --check "$BASE_SHA...$HEAD_SHA"
              ;;
            push)
              git diff --check "$BASE_SHA" "$HEAD_SHA"
              ;;
            workflow_dispatch)
              git show --check --format= "$HEAD_SHA"
              ;;
            *)
              printf 'Unsupported event: %s\n' "$GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
