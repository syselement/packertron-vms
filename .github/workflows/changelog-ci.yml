# This is a basic workflow to help you get started with Actions

name: Changelog CI

# Controls when the workflow will run
on:
  release:
    types: [created, edited]
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'  # Ignore changes to workflow files

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Default to read-only; the one job that needs to write grants itself the token.
permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Required: this job commits the version bump, regenerates CHANGELOG.md and
    # pushes the release tag. It deliberately keeps the checkout credentials
    # for that reason, so it must stay the only job with write access.
    permissions:
      contents: write
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      # Actions are pinned to commits rather than tags; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: "✏️ Conventional Changelog Action"
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-git-pull: "true"
          version-file: 'version.yaml'
          version-path: 'version'